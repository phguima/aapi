# --- Claude Code ---
- name: Software | Install Claude Code (native installer) for primary user
  ansible.builtin.shell:
    cmd: "curl -fsSL {{ claude_install_script_url }} | bash"
    creates: "{{ user_home }}/.local/bin/claude"
  become_user: "{{ user_name }}"
  when: user_name != 'root'
  tags: [ai, claude]

# --- Python AI Libraries ---
- name: Python | Ensure pipx path is in user shell configuration
  ansible.builtin.shell:
    cmd: "pipx ensurepath"
  become_user: "{{ user_name }}"
  register: pipx_ensurepath_res
  changed_when: "'is already in PATH' not in pipx_ensurepath_res.stdout"
  tags: [ai, python, pipx]

- name: Python | Install specialized python libraries via pipx
  community.general.pipx:
    name: "{{ item }}"
    state: install
  become_user: "{{ user_name }}"
  loop:
    - markitdown
    - notebooklm-py
    - pdf2docx
  register: pipx_install
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [ai, python, markitdown, notebooklm]

- name: Python | Install extra features and playwright into pipx environments
  ansible.builtin.command:
    cmd: "pipx inject {{ item.base }} {{ item.extra }}"
  become_user: "{{ user_name }}"
  loop:
    - { base: 'markitdown', extra: 'markitdown[all]' }
    - { base: 'notebooklm-py', extra: 'notebooklm-py[browser]' }
    - { base: 'notebooklm-py', extra: 'playwright' }
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [ai, python, markitdown, notebooklm]

- name: Python | Install Playwright Chromium in notebooklm-py venv
  ansible.builtin.command:
    cmd: "{{ user_home }}/.local/share/pipx/venvs/notebooklm-py/bin/playwright install chromium"
  become_user: "{{ user_name }}"
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [ai, python, notebooklm, playwright]
