---
# Tasks for 'common' role

- name: System | Ensure workspace directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/wks"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'
  when: user_name != 'root'
  tags: [system, workspace]

# --- Flatpak Applications ---
- name: System | Enable Flathub Repository
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  tags: [system, flatpak]

# --- Kernel Maintenance ---
- name: System | Kernel and Debug Maintenance
  ansible.builtin.import_tasks: kernel_maintenance.yml
  tags: [system, kernel, cleanup]

# --- ZSH and Oh-My-Zsh ---
- name: ZSH | Install ZSH, Git, and Curl
  ansible.builtin.dnf:
    name: [zsh, git, curl]
    state: present
  tags: [shell, omz, zsh, dnf]

# --- Git ---
# Written to the user's ~/.gitconfig as that user (explicit file, so it does not depend on the
# HOME that sudo passes). Identity comes from host_vars (bootstrap.sh); empty values are skipped.
- name: Git | Set user identity
  community.general.git_config:
    scope: file
    file: "{{ user_home }}/.gitconfig"
    name: "{{ item.key }}"
    value: "{{ item.value }}"
  become_user: "{{ user_name }}"
  loop:
    - { key: user.name, value: "{{ git_user_name }}" }
    - { key: user.email, value: "{{ git_user_email }}" }
  when: item.value | length > 0
  tags: [git]

- name: Git | Set default options
  community.general.git_config:
    scope: file
    file: "{{ user_home }}/.gitconfig"
    name: "{{ item.key }}"
    value: "{{ item.value }}"
  become_user: "{{ user_name }}"
  loop: "{{ git_config_defaults | dict2items }}"
  tags: [git]

- name: ZSH | Ensure Oh-My-Zsh is installed for users
  ansible.builtin.shell:
    cmd: "curl -fsSL {{ omz_install_script_url }} | sh -s -- --unattended --keep-zshrc"
    creates: "{{ item.home }}/.oh-my-zsh"
  become_user: "{{ item.name }}"
  loop: "{{ zsh_users }}"
  tags: [shell, omz]

- name: ZSH | Ensure .zshrc exists (copy template if missing)
  ansible.builtin.copy:
    src: "{{ item.home }}/.oh-my-zsh/templates/zshrc.zsh-template"
    dest: "{{ item.home }}/.zshrc"
    remote_src: yes
    owner: "{{ item.name }}"
    mode: '0644'
    force: no
  loop: "{{ zsh_users }}"
  tags: [shell, omz]

- name: ZSH | Change default shell to ZSH
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/zsh
  loop: "{{ zsh_users }}"
  tags: [shell, omz]

- name: ZSH | Copy custom theme for users
  ansible.builtin.copy:
    src: "{{ omz_theme_name }}.zsh-theme"
    dest: "{{ item.home }}/.oh-my-zsh/themes/{{ omz_theme_name }}.zsh-theme"
    owner: "{{ item.name }}"
    mode: '0644'
  loop: "{{ zsh_users }}"
  tags: [shell, omz]

- name: ZSH | Set theme in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ item.home }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME="{{ omz_theme_name }}"'
    owner: "{{ item.name }}"
  loop: "{{ zsh_users }}"
  tags: [shell, omz]

- name: ZSH | Set plugins in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ item.home }}/.zshrc"
    regexp: '^plugins=\('
    line: 'plugins=({{ omz_plugins | join(" ") }})'
    owner: "{{ item.name }}"
  loop: "{{ zsh_users }}"
  tags: [shell, omz]

# --- Antigravity CLI ---
# Runs before the aliases block: its shell setup ('agy install') deletes any 'alias antigravity=...'
# from .zshrc (that is why ours is named antigravity-ide), so .zshrc is settled before the block.
# Only for the user who runs the playbook: root has no workspace or agycli alias to use it with.
- name: Antigravity | Install Antigravity CLI for the user
  ansible.builtin.shell:
    cmd: "curl -fsSL {{ antigravity_install_script_url }} | bash"
    creates: "{{ item.home }}/.local/bin/agy"
  become_user: "{{ item.name }}"
  loop: "{{ zsh_users }}"
  when: item.name == user_name
  tags: [shell, antigravity]

# Root gets only the common aliases; the user who runs the playbook also gets zsh_aliases_user.
- name: ZSH | Add custom aliases to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ item.home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED ALIASES"
    block: "{{ zsh_aliases_common }}{{ zsh_aliases_user if item.name == user_name else '' }}"
    owner: "{{ item.name }}"
  loop: "{{ zsh_users }}"
  tags: [shell, omz, aliases]

# Drops the block written by AFPI under the old marker, so it is not left orphaned
# next to the renamed one below.
- name: ZSH | Remove legacy NVIDIA and API block from .zshrc
  ansible.builtin.blockinfile:
    path: "{{ item.home }}/.zshrc"
    marker: "# {mark} NVIDIA AND API CONFIGURATION"
    state: absent
  loop: "{{ zsh_users }}"
  tags: [shell, setup]

# Only for the user who runs the playbook: root does not use the API keys and has no business
# keeping secrets from the vault in its .zshrc.
- name: ZSH | Add API key configuration to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ item.home }}/.zshrc"
    marker: "# {mark} API CONFIGURATION"
    insertafter: '^# export MANPATH="/usr/local/man:\$MANPATH"'
    block: |
      # API KEYS Configuration
      {{ api_keys }}
    owner: "{{ item.name }}"
    mode: '0644'
  loop: "{{ zsh_users }}"
  when: item.name == user_name
  no_log: true
  tags: [shell, setup]

# Older runs wrote this block (API keys included) to root's .zshrc as well: remove it.
- name: ZSH | Remove API key block from other users' .zshrc
  ansible.builtin.blockinfile:
    path: "{{ item.home }}/.zshrc"
    marker: "# {mark} API CONFIGURATION"
    state: absent
  loop: "{{ zsh_users }}"
  when: item.name != user_name
  tags: [shell, setup]

# --- GRUB ---
- name: System | Configure GRUB settings
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    state: present
  loop:
    - { key: "GRUB_TIMEOUT", value: "{{ grub_timeout }}" }
    - { key: "GRUB_TERMINAL_OUTPUT", value: '"{{ grub_terminal_output }}"' }
    - { key: "GRUB_GFXPAYLOAD", value: '"{{ grub_gfxpayload }}"' }
    - { key: "GRUB_GFXMODE", value: '"{{ grub_gfxmode }}"' }
  notify: Regenerate GRUB
  tags: [system, grub]
