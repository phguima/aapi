---
# Tasks for 'update' role

# --- DNF optimization, CRB/EPEL & RPM Fusion ---
- name: DNF | Install dnf-plugins-core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  tags: [update, repos]

# CRB + EPEL must come before any other install: most 'apps' packages live in EPEL,
# and RPM Fusion for EL depends on it.
- name: Repos | Enable CRB repository
  community.general.dnf_config_manager:
    name: crb
    state: enabled
  tags: [update, repos]

- name: Repos | Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present
  tags: [update, repos]

- name: System | Optimize DNF Configuration
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "max_parallel_downloads", value: "{{ dnf_max_parallel_downloads }}" }
    - { key: "fastestmirror", value: "{{ dnf_fastestmirror }}" }
  tags: [update]

- name: System | Add RPM Fusion repositories
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
    disable_gpg_check: yes
  tags: [update, repos]

- name: System | Upgrade all packages and refresh dnf cache
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  become: true
  tags: [update]
# --- Reboot gate ---
# If the upgrade touched the kernel or core libraries, stop here: the rest of the playbook must
# run on the new kernel (VirtualBox builds its modules against the running kernel's
# kernel-devel, and kernel cleanup can only drop the old one once it is no longer running).
- name: System | Check whether a reboot is required
  ansible.builtin.command: dnf needs-restarting -r
  register: reboot_hint
  changed_when: false
  failed_when: reboot_hint.rc not in [0, 1]
  check_mode: false
  tags: [update]

- name: System | Stop until the system is rebooted
  when: reboot_hint.rc == 1
  tags: [update]
  block:
    - name: System | Ask for a reboot
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "The system was updated and needs a REBOOT before continuing."
          - "Reboot, then run the same ansible-playbook command again:"
          - "the update step will pass and the rest of the setup will run."
          - "=================================================================="

    - name: System | End the play for this host
      ansible.builtin.meta: end_host
