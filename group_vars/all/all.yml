---
# DNF Optimization
dnf_max_parallel_downloads: 15
dnf_fastestmirror: "True"

# GRUB Settings
grub_timeout: 5
grub_gfxmode: "1920x1080x32,1280x720x32,auto"
grub_gfxpayload: "keep"
grub_terminal_output: "gfxterm"

# Hardware Drivers
intel_media_packages:
  - libva-intel-driver
  - intel-media-driver

# Multimedia Packages
# No "@multimedia": Workstation already has the group, and RPM Fusion's version of it adds
# conditional freeworld packages (vlc-plugins-freeworld, libheif-freeworld) that are often built
# against newer vlc-libs/libheif than EPEL ships, which breaks the whole transaction.
multimedia_packages:
  - gstreamer1-plugins-bad-freeworld
  - gstreamer1-plugins-ugly
  - gstreamer1-plugin-libav

# Packages and Apps
dnf_packages_common:
  - 7zip             # 7z (was p7zip-plugins)
  - 7zip-standalone  # 7za (was p7zip)
#  - btrfs-assistant
  - chromium
  - clamav
  - clamav-freshclam
#  - darktable
  - fastfetch
  - htop
  - hwinfo
  - lm_sensors
  - lynis
  - nodejs
  - nvtop
  - pipx
  - python3-pip
#  - rawtherapee
  - rkhunter
  - ShellCheck
#  - solaar
#  - sqlitebrowser
  - testdisk
  - tmux
  - tuptime
  - unrar
  - unzip
  - uv
  - vim-enhanced

dnf_packages_gnome:
  - flatseal
  - gnome-tweaks

dnf_packages_kde:
  - ktorrent
  - plasma-sdk
  - kde-gtk-config


# Flatpak Apps
flatpak_apps_common:
  - com.bitwarden.desktop
  - com.dec05eba.gpu_screen_recorder
  - com.slack.Slack
  - com.spotify.Client
  - net.displaycal.DisplayCAL
#  - org.ferdium.Ferdium
  - org.zotero.Zotero
  - us.zoom.Zoom

flatpak_apps_gnome:
  - com.github.unrud.VideoDownloader
  - com.mattjakeman.ExtensionManager
  - de.haeckerfelix.Fragments

flatpak_apps_kde:
  - com.markopejic.downloader

fonts_packages:
  - fira-code-fonts

# Roboto is not packaged for EL10: installed from the latest upstream release
roboto_release_api: "https://api.github.com/repos/googlefonts/roboto-3-classic/releases/latest"
roboto_font_dir: "/usr/local/share/fonts/roboto"

# Brave Browser Settings
brave_gpg_key: "https://brave-browser-rpm-release.s3.brave.com/brave-core.asc"
brave_repo_url: "https://brave-browser-rpm-release.s3.brave.com/x86_64/"
brave_packages:
  - brave-browser
  - brave-origin

# VS Code Settings
vscode_gpg_key: "https://packages.microsoft.com/keys/microsoft.asc"
vscode_repo_url: "https://packages.microsoft.com/yumrepos/vscode"

# VirtualBox Settings (Oracle repository; not packaged for EL10)
virtualbox_gpg_key: "https://www.virtualbox.org/download/oracle_vbox_2016.asc"
virtualbox_repo_url: "https://download.virtualbox.org/virtualbox/rpm/el/{{ ansible_facts['distribution_major_version'] }}/$basearch"
virtualbox_package: VirtualBox-7.2
virtualbox_build_packages:
  - kernel-devel
  - gcc
  - make
  - elfutils-libelf-devel
# Oracle's vboxdrv.sh signs its modules with this key pair when Secure Boot is on
virtualbox_mok_dir: /var/lib/shim-signed/mok

# GitHub CLI Settings
gh_gpg_key: "https://cli.github.com/packages/githubcli-archive-keyring.asc"
gh_repo_url: "https://cli.github.com/packages/rpm"

# Oh-My-Zsh settings
omz_install_script_url: "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
omz_theme_name: "kali-like-alt"
omz_plugins:
  - git
# Nota: zsh-autosuggestions e zsh-syntax-highlighting são gerenciados internamente pelo tema kali-like-alt.


# Antigravity CLI settings
antigravity_install_script_url: "https://antigravity.google/cli/install.sh"
# Antigravity IDE: not installed by the playbook (manual tarball extract). When the binary is found
# here, the 'apps' role adds a menu entry for it; otherwise those tasks are skipped.
antigravity_ide_dir: "{{ user_home }}/wks/tools/antigravity"

# Claude Code settings
claude_install_script_url: "https://claude.ai/install.sh"

# Zsh Aliases
# zsh_aliases_common goes to every .zshrc the playbook manages, root included. zsh_aliases_user
# only to the user who runs the playbook: workspace and update shortcuts that make no sense for root.
# 'needs-restarting -r' (dnf4): without -r it lists processes instead of saying whether to reboot.
zsh_aliases_common: |
  alias zshconfig="nano ~/.zshrc"
  alias ohmyzsh="nano ~/.oh-my-zsh"
  alias lls="ls --color -lh --group-directories-first"
  alias llsa="ls --color -lha --group-directories-first"
  alias clean-cache="sudo sync; echo 3 | sudo tee /proc/sys/vm/drop_caches"

zsh_aliases_user: |
  alias claudecli="cd ~/wks; clear; claude"
  alias agycli="cd ~/wks; clear; agy"
  alias antigravity-ide='"{{ antigravity_ide_dir }}/antigravity"'
  alias full-update="flatpak update -y; sudo npm update -g; sudo dnf upgrade --refresh -y; dnf needs-restarting -r"

# PTYxis Settings
ptyxis_restore_window_size: "false"
ptyxis_default_columns: 120
ptyxis_default_rows: 35
ptyxis_cursor_shape: "underline"
ptyxis_cursor_blink_mode: "on"
ptyxis_use_system_font: "false"
ptyxis_font_name: "Fira Code 10"
ptyxis_opacity: 0.95

# MOK enrollment password (only used when Secure Boot is on, see the VirtualBox tasks in 'apps').
# One-time: typed once in the MokManager blue screen on the next boot. MokManager uses a US
# keyboard layout, so stick to plain letters, digits and '-'.
mok_password: "alma-aapi"

# Secrets (api_keys) live in group_vars/all/secrets.yml, encrypted with ansible-vault.
