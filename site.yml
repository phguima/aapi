---
# Master Playbook for AAPI (Ansible AlmaLinux Post-Install)

- name: AAPI | Ansible AlmaLinux Post-Install
  hosts: localhost
  become: yes

  pre_tasks:
    - name: AAPI | Environment Setup
      ansible.builtin.import_tasks: tasks/env_setup.yml
      tags: [always]

  roles:
    - { role: update, tags: [update] }
    - { role: hardware, tags: [hardware, drivers] }
    - { role: common, tags: [common, system] }
    - { role: apps, tags: [apps, software] }
    - { role: desktop, tags: [desktop, UI] }
    - { role: ai_tools, tags: [ai, gemini] }

  post_tasks:
    # gh login is interactive (browser + token in the keyring), so the playbook only reminds.
    # hosts.yml lists the logged-in hosts even when the token itself lives in the keyring, and reading
    # it does not need the user's D-Bus session (gh auth status run through sudo would).
    - name: GitHub CLI | Check login
      ansible.builtin.slurp:
        src: "{{ user_home }}/.config/gh/hosts.yml"
      register: gh_hosts
      failed_when: false
      tags: [always]

    - name: GitHub CLI | Remind to log in
      ansible.builtin.debug:
        msg:
          - "The GitHub CLI is not logged in. As {{ user_name }}, run:"
          - "  gh auth login --hostname github.com --git-protocol https --web"
          - "  gh auth setup-git"
      when: "'github.com:' not in (gh_hosts.content | default('') | b64decode)"
      tags: [always]

    - name: AAPI | Final Status
      ansible.builtin.debug:
        msg: 
          - "==========================================================="
          - "  AAPI DEPLOYMENT COMPLETED SUCCESSFULLY!                  "
          - "  Your AlmaLinux workstation is now optimized and ready.   "
          - "==========================================================="
      tags: [always]

  handlers:
    - name: Regenerate GRUB
      # Real config for both UEFI and BIOS on EL9+/EL10 (the ESP grub.cfg is a stub that loads it;
      # /etc/grub2-efi.cfg is only a symlink to it, and missing on BIOS installs).
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg

