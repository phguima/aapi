---
# Environment discovery and setup for all roles

- name: Env Setup | Ensure target is AlmaLinux 10
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'AlmaLinux'
      - ansible_facts['distribution_major_version'] == '10'
    fail_msg: >-
      AAPI targets AlmaLinux 10 only; detected
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true
  tags: [always]

- name: Env Setup | Get primary user data
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_facts['env']['SUDO_USER'] }}"
  register: primary_user_data
  when: ansible_facts['env']['SUDO_USER'] is defined and ansible_facts['env']['SUDO_USER'] != 'root'
  tags: [always]

- name: Env Setup | Set primary user facts
  set_fact:
    user_name: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"
    user_home: >-
      {{ 
        primary_user_data.ansible_facts.getent_passwd[ansible_facts['env']['SUDO_USER']][4] 
        if (primary_user_data.ansible_facts is defined and ansible_facts['env']['SUDO_USER'] is defined and ansible_facts['env']['SUDO_USER'] != 'root') 
        else (ansible_facts['env']['HOME'] | default('/root')) 
      }}
  tags: [always]

- name: Env Setup | Identify target users for shell setup
  set_fact:
    zsh_users:
      - name: "root"
        home: "/root"
      - name: "{{ user_name }}"
        home: "{{ user_home }}"
  when: user_name != 'root'
  tags: [always]

- name: Env Setup | Identify target users for shell setup (Root only)
  set_fact:
    zsh_users:
      - name: "root"
        home: "/root"
  when: user_name == 'root'
  tags: [always]

- name: Env Setup | Initialize hardware facts
  set_fact:
    is_intel: false
  tags: [always]

# Reads the SecureBoot EFI variable directly (5th byte: 1 = enabled), so it works before
# mokutil is installed; legacy-BIOS boots have no efivars and report false.
- name: Env Setup | Read Secure Boot state
  ansible.builtin.command: od -An -tu1 -j4 -N1 /sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
  register: secure_boot_raw
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [always]

- name: Env Setup | Set Secure Boot fact
  set_fact:
    is_secure_boot: "{{ secure_boot_raw.rc == 0 and (secure_boot_raw.stdout | trim) == '1' }}"
  tags: [always]

- name: Env Setup | Detect GPU Type
  ansible.builtin.shell: lspci | grep -iE "vga|3d|display"
  register: gpu_info_raw
  changed_when: false
  failed_when: false
  tags: [always, hardware]

- name: Env Setup | Set GPU info fact
  set_fact:
    gpu_info: "{{ gpu_info_raw.stdout | default('') }}"
    is_intel: "{{ gpu_info_raw.stdout is defined and gpu_info_raw.stdout is search('Intel', ignorecase=True) }}"
  tags: [always, hardware]

- name: Env Setup | Detect desktop environment
  set_fact:
    detected_xdg: "{{ lookup('env', 'XDG_CURRENT_DESKTOP') | default('') | upper }}"
  tags: [always, system, detection]

- name: Env Setup | Set DE Boolean Facts
  set_fact:
    is_gnome: "{{ 'GNOME' in detected_xdg }}"
    is_kde: "{{ 'KDE' in detected_xdg or 'PLASMA' in detected_xdg or 'KDE' in (ansible_facts['env']['XDG_CURRENT_DESKTOP'] | default('') | upper) }}"
  tags: [always, system, detection]
